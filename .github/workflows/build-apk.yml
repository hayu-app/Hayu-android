name: Build HAYU APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Copy and verify debug keystore
        run: |
          set -e

          test -f debug.keystore

          mkdir -p "$HOME/.android"
          cp debug.keystore "$HOME/.android/debug.keystore"

          echo "===== REPOSITORY KEYSTORE ====="
          keytool -list -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -storepass android |
            grep -E 'SHA1:|SHA256:'

          echo "===== ANDROID DEBUG KEYSTORE ====="
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -storepass android |
            grep -E 'SHA1:|SHA256:'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build APK Debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify Google Web Client ID
        run: |
          set -e

          EXPECTED_CLIENT_ID="133087066686-n8m4k4evrg5brc2bg2s8llussm0qsl9p.apps.googleusercontent.com"

          if grep -R -q "$EXPECTED_CLIENT_ID" \
            app/build/generated app/build/intermediates 2>/dev/null; then
            echo "Web Client ID cocok."
          else
            echo "ERROR: Web Client ID tidak ditemukan."
            exit 1
          fi

      - name: Verify APK signing certificate
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner tidak ditemukan."
            exit 1
          fi

          echo "===== APK SIGNING CERTIFICATE ====="
          "$APKSIGNER" verify --print-certs "$APK"

          ACTUAL_SHA1=$(
            "$APKSIGNER" verify --print-certs "$APK" |
            sed -n 's/.*certificate SHA-1 digest: //p' |
            head -n 1 |
            tr -d ':' |
            tr '[:upper:]' '[:lower:]'
          )

          EXPECTED_SHA1="d7d110077f9c300c23444a2afae6c37767cf2a96"

          echo "SHA-1 yang diharapkan: $EXPECTED_SHA1"
          echo "SHA-1 APK:             $ACTUAL_SHA1"

          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "ERROR: SHA-1 APK tidak cocok dengan debug.keystore!"
            exit 1
          fi

          echo "SHA-1 APK cocok."

      - name: Ukuran APK
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | sort -n -r | head -12

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hayu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
