name: Build HAYU APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Copy and verify debug keystore
        run: |
          set -e
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

          echo "===== SHA-1 KEYSTORE REPOSITORY ====="
          keytool -list -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android | grep -E 'SHA1:|SHA256:'

          echo "===== SHA-1 KEYSTORE GRADLE ====="
          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -storepass android \
            -keypass android | grep -E 'SHA1:|SHA256:'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build APK Debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify Google Web Client ID
        run: |
          set -e
          grep -R -q \
            '133087066686-n8m4k4evrg5brc2bg2s8llussm0qsl9p.apps.googleusercontent.com' \
            app/build/generated app/build/intermediates
          echo "Web Client ID cocok."

      - name: Verify APK signing certificate
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)

          test -f "$APK"
          test -n "$APKSIGNER"

          "$APKSIGNER" verify --print-certs "$APK"

          ACTUAL_SHA1=$("$APKSIGNER" verify --print-certs "$APK" |
            awk -F': ' '/certificate SHA-1 digest:/ {print $2; exit}' |
            tr -d ':' | tr '[:upper:]' '[:lower:]')

          EXPECTED_SHA1="d7d110077f9c300c23444a2afae6c37767cf2a96"

          echo "SHA-1 yang diharapkan: $EXPECTED_SHA1"
          echo "SHA-1 APK:             $ACTUAL_SHA1"

          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "ERROR: SHA-1 APK tidak cocok dengan debug.keystore!"
            exit 1
          fi

          echo "SHA-1 APK cocok."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hayu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
